<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manual Archive - STO 582</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700&family=Noto+Sans+KR:wght@400;700&display=swap');
        body { font-family: 'Inter', 'Noto Sans KR', sans-serif; background-color: #fafafa; }
        .manual-card { transition: 0.2s cubic-bezier(0.4, 0, 0.2, 1); border: 1px solid #eef2f6; }
        .manual-card:hover { transform: translateY(-3px); border-color: #0058a3; box-shadow: 0 10px 20px -5px rgba(0, 88, 163, 0.1); }
    </style>
</head>
<body class="py-12 px-6">

    <div class="max-w-4xl mx-auto">
        <div class="flex items-center justify-between mb-10">
            <button onclick="location.href='index.html'" class="w-10 h-10 rounded-full bg-white shadow-sm flex items-center justify-center text-gray-400 hover:text-blue-600 transition">
                <i class="fas fa-arrow-left"></i>
            </button>
            <h1 class="text-3xl font-black italic text-blue-800 uppercase tracking-tighter">Manual Archive</h1>
            <div class="w-10"></div>
        </div>

        <div class="bg-white rounded-3xl shadow-sm border border-gray-100 overflow-hidden">
            <div class="p-6 bg-gray-50 border-b flex justify-between items-center">
                <span id="fileCount" class="text-[10px] font-extrabold text-blue-600 bg-blue-50 px-3 py-1.5 rounded-full uppercase tracking-widest">Checking GitHub...</span>
                <span class="text-[10px] text-gray-300 font-bold uppercase tracking-widest italic">New Window View Mode</span>
            </div>

            <div id="manualContainer" class="grid grid-cols-1 gap-3 p-6">
                <div class="p-20 text-center text-gray-300">
                    <i class="fas fa-spinner animate-spin text-3xl mb-4"></i>
                    <p class="text-sm font-medium uppercase tracking-widest">Syncing with sto582racking...</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        // 🛠️ 업데이트된 유선님의 정보
        const GITHUB_USER = "yersundanny"; 
        const GITHUB_REPO = "sto582racking"; 
        const GITHUB_FOLDER = "docs"; 

        async function fetchManuals() {
            const container = document.getElementById('manualContainer');
            const countDisplay = document.getElementById('fileCount');

            try {
                // 1. GitHub API로 파일 목록 조회
                const response = await fetch(`https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents/${GITHUB_FOLDER}`);
                const files = await response.json();

                if (response.ok) {
                    const pdfFiles = files.filter(file => file.name.toLowerCase().endsWith('.pdf'));
                    countDisplay.innerText = `${pdfFiles.length} MANUALS DETECTED`;
                    
                    if (pdfFiles.length === 0) {
                        container.innerHTML = `<div class="p-20 text-center text-gray-400 font-medium italic">등록된 매뉴얼이 없습니다. (docs 폴더 확인)</div>`;
                        return;
                    }

                    container.innerHTML = pdfFiles.map(file => {
                        // 🌟 새 창에서 즉시 보기 URL (GitHub Pages 경로)
                        // 주의: GitHub Pages가 활성화되어 있어야 합니다.
                        const viewUrl = `https://${GITHUB_USER}.github.io/${GITHUB_REPO}/${GITHUB_FOLDER}/${encodeURIComponent(file.name)}`;
                        
                        return `
                            <div class="manual-card bg-white p-5 rounded-2xl flex items-center justify-between cursor-pointer group" 
                                 onclick="window.open('${viewUrl}', '_blank')">
                                <div class="flex items-center gap-5">
                                    <div class="w-12 h-12 bg-gray-50 text-red-500 rounded-xl flex items-center justify-center text-xl group-hover:bg-red-500 group-hover:text-white transition-all duration-300">
                                        <i class="fas fa-file-pdf"></i>
                                    </div>
                                    <div>
                                        <h3 class="font-bold text-gray-800 group-hover:text-blue-600 transition-colors">${file.name.replace('.pdf', '')}</h3>
                                        <div class="flex items-center gap-2 mt-0.5">
                                            <span class="text-[9px] text-gray-400 font-bold uppercase tracking-tighter">PDF Document</span>
                                            <span class="text-[9px] text-blue-300 font-bold uppercase tracking-tighter italic">Click to Open</span>
                                        </div>
                                    </div>
                                </div>
                                <div class="w-8 h-8 rounded-full flex items-center justify-center text-gray-200 group-hover:bg-blue-50 group-hover:text-blue-500 transition-all">
                                    <i class="fas fa-external-link-alt text-xs"></i>
                                </div>
                            </div>
                        `;
                    }).join('');
                } else {
                    throw new Error();
                }
            } catch (err) {
                container.innerHTML = `
                    <div class="p-20 text-center">
                        <i class="fas fa-exclamation-triangle text-red-300 text-3xl mb-4"></i>
                        <p class="text-red-400 text-sm font-bold uppercase">GitHub Sync Failed</p>
                        <p class="text-gray-400 text-xs mt-2 font-medium italic">저장소 이름(${GITHUB_REPO})과 폴더명(${GITHUB_FOLDER})을 확인하세요.</p>
                    </div>
                `;
            }
        }

        window.onload = fetchManuals;
    </script>
</body>
</html>
