<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manual Archive - STO 582</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="bg-gray-50">

    <div class="max-w-4xl mx-auto py-12 px-6">
        <div class="flex items-center justify-between mb-8">
            <button onclick="location.href='index.html'" class="text-gray-400 hover:text-gray-600 transition">
                <i class="fas fa-arrow-left text-xl"></i>
            </button>
            <h1 class="text-3xl font-bold text-gray-900 italic">Manual Archive</h1>
            <div class="w-8"></div>
        </div>

        <div class="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden">
            <div class="p-6 border-b bg-gray-50 flex justify-between items-center">
                <span class="text-sm font-bold text-gray-500 uppercase tracking-widest">Document List</span>
                <span id="fileCount" class="text-xs font-bold bg-blue-100 text-blue-600 px-2 py-1 rounded-full">0 Files</span>
            </div>

            <ul id="fileList" class="divide-y divide-gray-100">
                <li class="p-12 text-center text-gray-400">
                    <i class="fas fa-spinner animate-spin mb-3 text-2xl"></i>
                    <p>파일 목록을 동기화 중입니다...</p>
                </li>
            </ul>
        </div>
    </div>

    <script>
        // 유선님의 GitHub 정보
        const USERNAME = "yersundanny"; // 유선님의 깃허브 ID로 확인해주세요
        const REPO = "sto582racking"; // 저장소 이름
        const FOLDER = "docs"; // PDF 파일이 들어있는 폴더명

        async function loadFiles() {
            const listElement = document.getElementById('fileList');
            const countElement = document.getElementById('fileCount');

            try {
                // 토큰 없이 공개된 파일 목록을 가져오는 GitHub API (공개 저장소는 제한이 거의 없음)
                const response = await fetch(`https://api.github.com/repos/${USERNAME}/${REPO}/contents/${FOLDER}`);
                const files = await response.json();

                if (response.ok) {
                    const pdfFiles = files.filter(file => file.name.toLowerCase().endsWith('.pdf'));
                    countElement.innerText = `${pdfFiles.length} Files`;
                    
                    if (pdfFiles.length === 0) {
                        listElement.innerHTML = '<li class="p-12 text-center text-gray-400">등록된 PDF 매뉴얼이 없습니다.</li>';
                        return;
                    }

                    listElement.innerHTML = pdfFiles.map(file => `
                        <li class="p-5 hover:bg-blue-50 transition cursor-pointer flex items-center justify-between" 
                            onclick="window.open('${file.download_url}', '_blank')">
                            <div class="flex items-center gap-4">
                                <div class="w-10 h-10 bg-red-50 text-red-500 rounded-lg flex items-center justify-center">
                                    <i class="fas fa-file-pdf text-xl"></i>
                                </div>
                                <div>
                                    <p class="font-bold text-gray-800">${file.name.replace('.pdf', '')}</p>
                                    <p class="text-xs text-gray-400 uppercase tracking-tighter">Click to view manual</p>
                                </div>
                            </div>
                            <i class="fas fa-external-link-alt text-gray-300"></i>
                        </li>
                    `).join('');
                } else {
                    throw new Error();
                }
            } catch (error) {
                listElement.innerHTML = '<li class="p-12 text-center text-red-400 font-medium">목록을 불러오지 못했습니다. <br><span class="text-xs opacity-60">저장소 이름과 ID가 정확한지 확인해 주세요.</span></li>';
            }
        }

        window.onload = loadFiles;
    </script>
</body>
</html>
