<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Location Guide - STO 582</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700&family=Noto+Sans+KR:wght@400;700&display=swap');
        body { font-family: 'Inter', 'Noto Sans KR', sans-serif; background-color: #fafafa; }
        
        /* 사진 카드 디자인 */
        .loc-card { background: white; border-radius: 20px; overflow: hidden; border: 1px solid #e5e7eb; transition: 0.3s; }
        .loc-card:hover { transform: translateY(-5px); shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1); }
        .img-container { position: relative; width: 100%; height: 200px; background-color: #f1f5f9; overflow: hidden; }
        .img-container img { width: 100%; height: 100%; object-fit: cover; transition: 0.5s; }
        .loc-card:hover img { scale: 1.1; }

        /* 상태 뱃지 */
        .status-badge { position: absolute; top: 12px; right: 12px; background: rgba(0, 88, 163, 0.9); color: white; font-size: 10px; font-weight: 900; padding: 4px 10px; border-radius: 99px; backdrop-filter: blur(4px); }
    </style>
</head>
<body class="pb-20">

    <header class="pt-12 pb-8 px-6 max-w-4xl mx-auto flex justify-between items-center">
        <div>
            <button onclick="location.href='index.html'" class="text-blue-800 mb-2 flex items-center gap-1 text-sm font-bold">
                <i class="fas fa-arrow-left"></i> Back
            </button>
            <h1 class="text-3xl font-black text-gray-900 italic uppercase">Location Guide</h1>
        </div>
        <div class="text-right">
            <span class="text-[10px] font-black text-blue-600 border border-blue-200 px-2 py-1 rounded uppercase">STO 582 Only</span>
        </div>
    </header>

    <section class="max-w-4xl mx-auto px-6 mb-8">
        <div class="relative">
            <i class="fas fa-search absolute left-4 top-1/2 -translate-y-1/2 text-gray-300"></i>
            <input type="text" placeholder="부품명 또는 위치 검색..." class="w-full pl-12 pr-4 py-4 bg-white border border-gray-100 rounded-2xl shadow-sm outline-none focus:border-blue-500 transition font-medium text-sm">
        </div>
    </section>

    <section class="max-w-4xl mx-auto px-6 grid grid-cols-1 md:grid-cols-2 gap-6" id="locationList">
        
        <div class="loc-card">
            <div class="img-container">
                <img src="https://images.unsplash.com/photo-1586023492125-27b2c045efd7?q=80&w=800" alt="Racking Room A">
                <span class="status-badge">Racking Room A</span>
            </div>
            <div class="p-6">
                <h3 class="text-lg font-bold text-gray-900 mb-2">기둥(Upright) P656 구역</h3>
                <p class="text-sm text-gray-500 leading-relaxed">
                    A룸 진입 후 우측 세 번째 선반 하단에 위치해 있습니다. 신규 브레이싱 부품과 혼동되지 않도록 주의하세요.
                </p>
                <div class="mt-4 pt-4 border-t flex justify-between items-center">
                    <span class="text-[10px] font-bold text-gray-400 uppercase tracking-widest"><i class="fas fa-map-marker-alt mr-1"></i> Zone A-03</span>
                    <button class="text-xs font-black text-blue-600 uppercase">Detail View</button>
                </div>
            </div>
        </div>

        <div class="loc-card">
            <div class="img-container">
                <img src="https://images.unsplash.com/photo-1553413077-190dd305871c?q=80&w=800" alt="P2 Storage">
                <span class="status-badge">P2 Storage</span>
            </div>
            <div class="p-6">
                <h3 class="text-lg font-bold text-gray-900 mb-2">빔(Beam) 대형 규격 적재함</h3>
                <p class="text-sm text-gray-500 leading-relaxed">
                    P2 하역장 근처 철제 랙에 적재되어 있습니다. 지게차 진입 시 주변 코워커 안전 거리를 반드시 확보해야 합니다.
                </p>
                <div class="mt-4 pt-4 border-t flex justify-between items-center">
                    <span class="text-[10px] font-bold text-gray-400 uppercase tracking-widest"><i class="fas fa-map-marker-alt mr-1"></i> Zone P2-EX</span>
                    <button class="text-xs font-black text-blue-600 uppercase">Detail View</button>
                </div>
            </div>
        </div>

    </section>

    

</body>
</html>
