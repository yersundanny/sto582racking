<section class="max-w-6xl mx-auto px-6 mb-12">
    <div class="bg-white border-2 border-dashed border-gray-200 rounded-2xl p-6 shadow-sm">
        <div class="flex justify-between items-center mb-4">
            <h2 class="text-lg font-bold text-gray-800 flex items-center gap-2">
                <i class="fas fa-bullhorn text-blue-600"></i> 스페셜리스트 공지 및 메모 (Specialist Notice)
            </h2>
            <button onclick="toggleEditor()" id="editBtn" class="text-xs font-bold bg-gray-100 px-3 py-2 rounded-lg hover:bg-gray-200 transition">
                <i class="fas fa-pen"></i> 작성/수정하기
            </a>
        </div>

        <div id="noticeDisplay" class="min-h-[100px] p-4 bg-gray-50 rounded-xl mb-4 overflow-auto border border-transparent transition-all">
            <p class="text-gray-400 italic">등록된 공지사항이 없습니다. 내용을 입력해 주세요.</p>
        </div>

        <div id="editorSection" class="hidden space-y-4 border-t pt-4 mt-4">
            <div id="loginForm" class="flex gap-2 mb-4 p-3 bg-blue-50 rounded-lg">
                <input type="text" id="adminId" placeholder="ID" class="w-24 px-2 py-1 text-sm border rounded">
                <input type="password" id="adminPw" placeholder="PW" class="w-24 px-2 py-1 text-sm border rounded">
                <button onclick="checkAuth()" class="bg-blue-600 text-white px-3 py-1 text-sm rounded font-bold">인증</button>
            </div>

            <div id="editTools" class="hidden space-y-3">
                <div class="flex flex-wrap gap-2 items-center bg-gray-100 p-2 rounded">
                    <select id="fontSize" onchange="execCmd('fontSize', this.value)" class="text-xs border rounded p-1">
                        <option value="3">보통 크기</option>
                        <option value="5">크게</option>
                        <option value="7">매우 크게</option>
                    </select>
                    <input type="color" id="fontColor" onchange="execCmd('foreColor', this.value)" title="글자 색상" class="w-8 h-8 p-0 border-0 bg-transparent">
                    <button onclick="execCmd('bold')" class="px-2 py-1 bg-white border rounded hover:bg-gray-50"><i class="fas fa-bold"></i></button>
                    <button onclick="execCmd('italic')" class="px-2 py-1 bg-white border rounded hover:bg-gray-50"><i class="fas fa-italic"></i></button>
                    <button onclick="deleteNotice()" class="ml-auto text-xs text-red-500 font-bold px-2 py-1 border border-red-200 rounded hover:bg-red-50">전체 삭제</button>
                </div>
                
                <div id="richEditor" contenteditable="true" class="w-full min-h-[150px] p-4 border rounded-xl bg-white focus:outline-blue-400"></div>
                
                <div class="flex justify-end gap-2">
                    <button onclick="toggleEditor()" class="px-4 py-2 text-sm font-bold text-gray-500">취소</button>
                    <button onclick="saveNotice()" class="px-6 py-2 bg-blue-600 text-white rounded-lg text-sm font-bold shadow-md hover:bg-blue-700">저장 (Save)</button>
                </div>
            </div>
        </div>
    </div>
</section>

<script>
    // 유선님이 지정하신 ID/PW
    const VALID_ID = "sto582";
    const VALID_PW = "sto582";

    const display = document.getElementById('noticeDisplay');
    const editor = document.getElementById('richEditor');
    const editorSection = document.getElementById('editorSection');
    const loginForm = document.getElementById('loginForm');
    const editTools = document.getElementById('editTools');

    // 페이지 로드 시 저장된 내용 불러오기
    window.onload = function() {
        const savedData = localStorage.getItem('rackingNotice');
        if (savedData) {
            display.innerHTML = savedData;
        }
    }

    function toggleEditor() {
        editorSection.classList.toggle('hidden');
        if (editorSection.classList.contains('hidden')) {
            loginForm.classList.remove('hidden');
            editTools.classList.add('hidden');
        }
    }

    function checkAuth() {
        const id = document.getElementById('adminId').value;
        const pw = document.getElementById('adminPw').value;

        if (id === VALID_ID && pw === VALID_PW) {
            loginForm.classList.add('hidden');
            editTools.classList.remove('hidden');
            editor.innerHTML = display.innerHTML === '<p class="text-gray-400 italic">등록된 공지사항이 없습니다. 내용을 입력해 주세요.</p>' ? "" : display.innerHTML;
        } else {
            alert("아이디 또는 비밀번호가 일치하지 않습니다.");
        }
    }

    function execCmd(cmd, value) {
        document.execCommand(cmd, false, value);
    }

    function saveNotice() {
        const content = editor.innerHTML;
        if (content.trim() === "") {
            display.innerHTML = '<p class="text-gray-400 italic">등록된 공지사항이 없습니다. 내용을 입력해 주세요.</p>';
            localStorage.removeItem('rackingNotice');
        } else {
            display.innerHTML = content;
            localStorage.setItem('rackingNotice', content);
        }
        toggleEditor();
        alert("공지사항이 저장되었습니다.");
    }

    function deleteNotice() {
        if (confirm("정말로 모든 내용을 삭제하시겠습니까?")) {
            editor.innerHTML = "";
            saveNotice();
        }
    }
</script>
