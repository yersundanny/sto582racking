<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STO 582 Racking Archive</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700&family=Noto+Sans+KR:wght@400;700&display=swap');
        body { font-family: 'Inter', 'Noto Sans KR', sans-serif; background-color: #fafafa; }
        .card-container { transition: 0.3s; background: white; border: 1px solid #e5e7eb; border-radius: 12px; overflow: hidden; cursor: pointer; }
        .card-container:hover { transform: translateY(-5px); box-shadow: 0 10px 20px rgba(0,0,0,0.05); border-color: #0058a3; }
        .icon-wrapper { height: 120px; display: flex; align-items: center; justify-content: center; font-size: 2.5rem; background-color: #f8fafc; }
        .card-container:hover .icon-wrapper { background-color: #0058a3; color: #ffdb00; }
        .today-card { border: 2px solid #0058a3 !important; background-color: #f0f7ff !important; position: relative; }
        .today-badge { position: absolute; top: 10px; right: 10px; background: #0058a3; color: white; font-size: 8px; font-weight: 900; padding: 2px 6px; border-radius: 99px; }
        .tab-active { background-color: #0058a3; color: white; border-color: #0058a3; }
    </style>
</head>
<body>

    <header class="pt-16 pb-10 px-6 max-w-6xl mx-auto text-center">
        <h1 class="text-3xl md:text-4xl font-black mb-4 text-blue-800 italic uppercase">STO 582 Racking Archive</h1>
        <p class="text-gray-400 text-xs font-bold uppercase tracking-widest">Digital Hub for Racking Specialists</p>
    </header>

    <section class="max-w-6xl mx-auto px-6 mb-8">
        <div class="bg-white border-2 border-dashed border-gray-200 rounded-2xl p-5">
            <div class="flex justify-between items-center mb-2">
                <span class="text-xs font-bold text-gray-500 uppercase"><i class="fas fa-bullhorn text-blue-600 mr-1"></i> Notice</span>
                <button onclick="toggleEditor()" class="text-[10px] text-gray-400 underline uppercase">Admin</button>
            </div>
            <div id="noticeDisplay" class="text-sm text-gray-600 min-h-[40px]">공지 로딩 중...</div>
            <div id="editorSection" class="hidden mt-4 pt-4 border-t">
                <input type="password" id="adminPw" placeholder="PW" class="text-xs border p-1 rounded outline-none">
                <button onclick="checkAuth()" class="bg-blue-600 text-white text-xs px-2 py-1 rounded">인증</button>
                <div id="editTools" class="hidden mt-2">
                    <div id="richEditor" contenteditable="true" class="border p-2 text-sm min-h-[60px] bg-white mb-2"></div>
                    <button id="saveBtn" onclick="saveNotice()" class="bg-blue-600 text-white text-xs px-3 py-1 rounded">저장</button>
                </div>
            </div>
        </div>
    </section>

    <section class="max-w-6xl mx-auto px-6 mb-12">
        <div class="bg-white border border-gray-100 rounded-2xl p-6 shadow-sm">
            <div class="flex flex-col md:flex-row justify-between items-center mb-6 gap-4">
                <h2 id="viewTitle" class="text-xl font-bold italic uppercase">Weekly Plan</h2>
                <div class="flex bg-gray-100 p-1 rounded-lg text-[11px] font-bold">
                    <button id="tabWeek" onclick="switchView('week')" class="px-4 py-1.5 rounded-md tab-active transition-all">WEEKLY</button>
                    <button id="tabMonth" onclick="switchView('month')" class="px-4 py-1.5 rounded-md text-gray-400 transition-all ml-1">MONTHLY</button>
                </div>
            </div>
            <div id="scheduleGrid" class="grid grid-cols-1 md:grid-cols-5 gap-3">
                <p class="text-gray-400 italic p-10 col-span-5 text-center">스케줄 로드 중...</p>
            </div>
        </div>
    </section>

    <section class="max-w-6xl mx-auto px-6 pb-20 grid grid-cols-2 md:grid-cols-3 gap-6">
        <div class="card-container" onclick="location.href='manuals-list.html'">
            <div class="icon-wrapper text-blue-600"><i class="fas fa-file-alt"></i></div>
            <div class="p-4 text-center"><h3 class="text-sm font-bold">Manual Archive</h3></div>
        </div>
        <div class="card-container" onclick="alert('Assembly Guide 준비 중')">
            <div class="icon-wrapper text-red-500"><i class="fas fa-video"></i></div>
            <div class="p-4 text-center"><h3 class="text-sm font-bold">Assembly Video</h3></div>
        </div>
        <div class="card-container" onclick="location.href='location-guide.html'">
            <div class="icon-wrapper text-green-600"><i class="fas fa-map-marker-alt"></i></div>
            <div class="p-4 text-center"><h3 class="text-sm font-bold">Location Guide</h3></div>
        </div>
        <div class="card-container" onclick="window.open('https://docs.google.com/spreadsheets/d/...','_blank')">
            <div class="icon-wrapper text-orange-500"><i class="fas fa-box"></i></div>
            <div class="p-4 text-center"><h3 class="text-sm font-bold">Stock Check</h3></div>
        </div>
        <div class="card-container" onclick="location.href='safety-main.html'">
            <div class="icon-wrapper text-teal-600"><i class="fas fa-shield-alt"></i></div>
            <div class="p-4 text-center"><h3 class="text-sm font-bold">Safety Center</h3></div>
        </div>
        <div class="card-container" onclick="location.href='old-vs-new.html'">
            <div class="icon-wrapper text-gray-500"><i class="fas fa-exchange-alt"></i></div>
            <div class="p-4 text-center"><h3 class="text-sm font-bold">Old vs New</h3></div>
        </div>
    </section>

    <script>
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycby4P1z72hWZj6QDX4tX2sjO3UOg8ujPc7I3T0hjq8tz3z_dbZRZD7nsF1OGLN-aLCRF/exec";
        let cachedData = [];
        let currentMode = 'week';

        window.addEventListener('DOMContentLoaded', () => { fetchNotice(); loadAllData(); });

        async function fetchNotice() {
            try {
                const res = await fetch(SCRIPT_URL + "?action=getNotice");
                document.getElementById('noticeDisplay').innerHTML = await res.text() || '공지 없음';
            } catch(e) {}
        }

        async function loadAllData() {
            try {
                const res = await fetch(SCRIPT_URL + "?action=getSchedule");
                cachedData = await res.json();
                renderSchedule();
            } catch(e) { document.getElementById('scheduleGrid').innerHTML = "로드 실패"; }
        }

        function switchView(mode) {
            currentMode = mode;
            document.getElementById('tabWeek').className = mode === 'week' ? "px-4 py-1.5 rounded-md tab-active" : "px-4 py-1.5 rounded-md text-gray-400";
            document.getElementById('tabMonth').className = mode === 'month' ? "px-4 py-1.5 rounded-md tab-active" : "px-4 py-1.5 rounded-md text-gray-400";
            document.getElementById('viewTitle').innerText = mode === 'week' ? "Weekly Plan" : "Monthly Plan";
            renderSchedule();
        }

        function renderSchedule() {
            const grid = document.getElementById('scheduleGrid');
            const now = new Date();
            grid.innerHTML = "";

            const todayStr = getKSTDateString(now);
            let filtered = [];

            if (currentMode === 'week') {
                const day = now.getDay();
                const diff = day === 0 ? -6 : 1 - day;
                const mon = new Date(new Date().setDate(now.getDate() + diff));
                const fri = new Date(mon); fri.setDate(mon.getDate() + 4);
                
                const monStr = getKSTDateString(mon);
                const friStr = getKSTDateString(fri);

                filtered = cachedData.filter(d => d.date >= monStr && d.date <= friStr);
                grid.className = "grid grid-cols-1 md:grid-cols-5 gap-3";
            } else {
                const monthPrefix = todayStr.substring(0, 7); // "2026-02"
                filtered = cachedData.filter(d => d.date.startsWith(monthPrefix) && !["토", "일"].includes(d.day));
                grid.className = "grid grid-cols-2 md:grid-cols-4 lg:grid-cols-5 gap-3";
            }

            if(filtered.length === 0) {
                grid.innerHTML = "<p class='col-span-full text-center py-10 text-gray-400 italic'>일정이 없습니다.</p>";
                return;
            }

            filtered.forEach(item => {
                const isToday = item.date === todayStr;
                grid.innerHTML += `
                    <div class="card-container p-4 ${isToday ? 'today-card' : ''}">
                        ${isToday ? '<span class="today-badge">TODAY</span>' : ''}
                        <div class="text-[10px] font-bold text-blue-600 mb-1 uppercase">${item.day}요일</div>
                        <div class="text-xs font-bold mb-3">${item.date.split('-')[1]}월 ${item.date.split('-')[2]}일</div>
                        <div class="text-[11px] text-left space-y-2 border-t pt-2">
                            <div><span class="text-gray-400 font-bold mr-1 italic">AM</span> ${item.am || '-'}</div>
                            <div><span class="text-gray-400 font-bold mr-1 italic">PM</span> ${item.pm || '-'}</div>
                        </div>
                        ${item.note ? `<p class="mt-2 text-[9px] text-red-500 font-bold italic">${item.note}</p>` : ''}
                    </div>
                `;
            });
        }

        function getKSTDateString(date) {
            const offset = 9 * 60 * 60 * 1000;
            const kstDate = new Date(date.getTime() + offset);
            return kstDate.toISOString().split('T')[0];
        }

        function toggleEditor() { document.getElementById('editorSection').classList.toggle('hidden'); }
        function checkAuth() { if(document.getElementById('adminPw').value === "sto582") { document.getElementById('loginForm').classList.add('hidden'); document.getElementById('editTools').classList.remove('hidden'); document.getElementById('richEditor').innerHTML = document.getElementById('noticeDisplay').innerHTML; } }
        async function saveNotice() {
            const btn = document.getElementById('saveBtn'); btn.innerText = "Syncing...";
            await fetch(SCRIPT_URL, { method: 'POST', body: JSON.stringify({ action: "save", content: document.getElementById('richEditor').innerHTML }) });
            location.reload();
        }
    </script>
</body>
</html>
