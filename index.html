<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>STO 582 Racking Archive</title>
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="STO 582">
    <link rel="apple-touch-icon" href="icon.png">

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700&family=Noto+Sans+KR:wght@400;700&display=swap');
        body { font-family: 'Inter', 'Noto Sans KR', sans-serif; background-color: #fafafa; -webkit-tap-highlight-color: transparent; }
        .card-container { transition: 0.3s; background: white; border: 1px solid #e5e7eb; border-radius: 12px; overflow: hidden; cursor: pointer; }
        .card-container:hover { transform: translateY(-5px); border-color: #0058a3; }
        .icon-wrapper { height: 120px; display: flex; align-items: center; justify-content: center; font-size: 2.5rem; background-color: #f8fafc; }
        .today-card { border: 2px solid #0058a3 !important; background-color: #f0f7ff !important; position: relative; }
        .today-badge { position: absolute; top: 10px; right: 10px; background: #0058a3; color: white; font-size: 8px; font-weight: 900; padding: 2px 6px; border-radius: 99px; }
        /* 아이폰 하단 바 영역 대응 */
        body { padding-bottom: env(safe-area-inset-bottom); }
    </style>
</head>
<body>

    <header class="pt-16 pb-10 px-6 max-w-6xl mx-auto text-center">
        <h1 class="text-3xl font-black mb-4 text-blue-800 italic uppercase">STO 582 Racking Archive</h1>
        <p class="text-gray-500 text-sm font-medium">이케아 코워커를 위한 랙킹 통합 가이드 센터</p>
    </header>

    <section class="max-w-6xl mx-auto px-6 mb-8">
        <div class="bg-white border border-gray-100 rounded-2xl p-6 shadow-sm">
            <h2 class="text-xl font-bold italic uppercase mb-4 text-gray-900">This Week Plan</h2>
            <div id="scheduleGrid" class="grid grid-cols-1 md:grid-cols-5 gap-3">
                <p class="col-span-5 text-center py-10 text-gray-400 italic">스케줄 로드 중...</p>
            </div>
        </div>
    </section>

    <section class="max-w-6xl mx-auto px-6 pb-20 grid grid-cols-2 md:grid-cols-3 gap-4">
        <div class="card-container" onclick="location.href='manuals-list.html'">
            <div class="icon-wrapper text-blue-600"><i class="fas fa-file-alt"></i></div>
            <div class="p-4 text-center"><h3 class="text-sm font-bold">Manuals</h3></div>
        </div>
        <div class="card-container" onclick="alert('준비 중')">
            <div class="icon-wrapper text-red-500"><i class="fas fa-video"></i></div>
            <div class="p-4 text-center"><h3 class="text-sm font-bold">Assembly</h3></div>
        </div>
        <div class="card-container" onclick="location.href='location-guide.html'">
            <div class="icon-wrapper text-green-600"><i class="fas fa-map-marker-alt"></i></div>
            <div class="p-4 text-center"><h3 class="text-sm font-bold">Location</h3></div>
        </div>
        <div class="card-container" onclick="window.open('https://docs.google.com/spreadsheets/d/e/2PACX-1vS8K4qcRhrjAWltpEoweWyh612n-ZxOUg1xb170ynA1ArlL0qJBQv0bQ6Ow-zUgDTC80OCXbJ3QIHfo/pubhtml?gid=2004724448&single=true','_blank')">
            <div class="icon-wrapper text-orange-500"><i class="fas fa-box"></i></div>
            <div class="p-4 text-center"><h3 class="text-sm font-bold">Stock Check</h3></div>
        </div>
        <div class="card-container" onclick="location.href='safety-main.html'">
            <div class="icon-wrapper text-teal-600"><i class="fas fa-shield-alt"></i></div>
            <div class="p-4 text-center"><h3 class="text-sm font-bold">Safety</h3></div>
        </div>
        <div class="card-container" onclick="location.href='old-vs-new.html'">
            <div class="icon-wrapper text-gray-500"><i class="fas fa-exchange-alt"></i></div>
            <div class="p-4 text-center"><h3 class="text-sm font-bold">Old vs New</h3></div>
        </div>
    </section>

    <script>
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycby4P1z72hWZj6QDX4tX2sjO3UOg8ujPc7I3T0hjq8tz3z_dbZRZD7nsF1OGLN-aLCRF/exec";

        async function loadSchedule() {
            try {
                const res = await fetch(SCRIPT_URL + "?action=getSchedule");
                const data = await res.json();
                const grid = document.getElementById('scheduleGrid');
                grid.innerHTML = "";

                // 이번 주 월~금 필터링 로직 (기존과 동일)
                const now = new Date();
                const day = now.getDay();
                const diff = day === 0 ? -6 : 1 - day;
                const mon = new Date(new Date().setDate(now.getDate() + diff));
                mon.setHours(0,0,0,0);
                const fri = new Date(mon); fri.setDate(mon.getDate() + 4);

                const filtered = data.filter(d => {
                    const dDate = new Date(d.date);
                    return dDate >= mon && dDate <= fri;
                });

                filtered.forEach(item => {
                    const isToday = new Date(item.date).toDateString() === now.toDateString();
                    grid.innerHTML += `
                        <div class="card-container p-4 ${isToday ? 'today-card' : ''}">
                            ${isToday ? '<span class="today-badge">TODAY</span>' : ''}
                            <div class="text-[10px] font-bold text-blue-600 mb-1 uppercase">${item.day}</div>
                            <div class="text-xs font-bold mb-3">${(new Date(item.date).getMonth()+1)}/${new Date(item.date).getDate()}</div>
                            <div class="text-[11px] text-left space-y-1 border-t pt-2">
                                <div><span class="text-gray-400 font-bold mr-1">AM</span> ${item.am || '-'}</div>
                                <div><span class="text-gray-400 font-bold mr-1">PM</span> ${item.pm || '-'}</div>
                            </div>
                        </div>
                    `;
                });
            } catch(e) { document.getElementById('scheduleGrid').innerHTML = "로드 실패"; }
        }

        window.onload = loadSchedule;
    </script>
</body>
</html>
