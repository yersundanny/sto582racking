<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>STO 582 Racking Archive</title>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="icon.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700&family=Noto+Sans+KR:wght@400;700&display=swap');
        body { font-family: 'Inter', 'Noto Sans KR', sans-serif; background-color: #fafafa; -webkit-tap-highlight-color: transparent; }
        .card-container { transition: 0.3s ease; background: white; border: 1px solid #e5e7eb; border-radius: 12px; overflow: hidden; cursor: pointer; }
        .card-container:hover { transform: translateY(-8px); box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1); border-color: #0058a3; }
        .icon-wrapper { height: 140px; display: flex; align-items: center; justify-content: center; font-size: 3rem; background-color: #f8fafc; }
        .schedule-card { background: white; border: 1px solid #eee; border-radius: 12px; padding: 12px; min-height: 110px; }
        .today-card { border: 2px solid #0058a3 !important; background-color: #f0f7ff !important; position: relative; }
        .today-badge { position: absolute; top: 6px; right: 6px; background: #0058a3; color: white; font-size: 8px; font-weight: 900; padding: 1px 5px; border-radius: 99px; }
        .sun { color: #ef4444; } .sat { color: #3b82f6; }
        #videoModal, #stockModal { backdrop-filter: blur(4px); transition: 0.3s; z-index: 100; }
    </style>
</head>
<body>

    <header class="pt-12 pb-8 px-6 max-w-6xl mx-auto flex justify-between items-end">
        <div>
            <h1 class="text-4xl font-black text-blue-800 italic uppercase">STO 582 Racking</h1>
            <p class="text-gray-400 text-xs font-bold uppercase tracking-widest">Digital Hub for Specialists</p>
        </div>
        <button onclick="location.href='mypage.html'" class="w-10 h-10 bg-white border rounded-full flex items-center justify-center text-gray-400 shadow-sm"><i class="fas fa-user"></i></button>
    </header>

    <section class="max-w-6xl mx-auto px-6 mb-8">
        <div class="bg-white border-2 border-dashed border-gray-200 rounded-2xl p-5 shadow-sm">
            <h2 class="text-[10px] font-black text-gray-400 uppercase mb-2 tracking-widest"><i class="fas fa-bullhorn text-blue-600 mr-1"></i> Live Notice</h2>
            <div id="noticeDisplay" class="text-sm text-gray-700 font-medium leading-relaxed italic">공지사항을 불러오는 중...</div>
        </div>
    </section>

    <section class="max-w-6xl mx-auto px-6 mb-12">
        <div class="bg-white border border-gray-100 rounded-3xl p-6 shadow-sm">
            <div class="flex flex-col md:flex-row justify-between items-center mb-6 gap-4">
                <div class="flex items-center gap-4">
                    <div id="monthNav" class="hidden flex items-center gap-3 bg-gray-50 px-3 py-1 rounded-full border">
                        <button onclick="changeMonth(-1)"><i class="fas fa-chevron-left text-blue-800"></i></button>
                        <span id="displayMonthLabel" class="font-black text-lg text-gray-800 min-w-[50px] text-center">월</span>
                        <button onclick="changeMonth(1)"><i class="fas fa-chevron-right text-blue-800"></i></button>
                    </div>
                    <div id="weeklyLabel"><h2 class="text-2xl font-black text-gray-900 italic uppercase tracking-tighter">Plan View</h2><p id="currentRangeText" class="text-[10px] text-blue-600 font-bold font-mono">Syncing...</p></div>
                </div>
                <div class="flex bg-gray-100 p-1 rounded-xl shadow-inner">
                    <button onclick="switchView('weekly')" id="btnWeekly" class="px-6 py-2 text-xs font-bold rounded-lg bg-white text-blue-600 shadow-sm">WEEKLY</button>
                    <button onclick="switchView('monthly')" id="btnMonthly" class="px-6 py-2 text-xs font-bold rounded-lg text-gray-500">MONTHLY</button>
                </div>
            </div>
            <div id="calendarHeader" class="hidden grid grid-cols-7 gap-1 mb-2 text-[9px] font-black uppercase text-center text-gray-400">
                <div class="sun">Sun</div><div>Mon</div><div>Tue</div><div>Wed</div><div>Thu</div><div>Fri</div><div class="sat">Sat</div>
            </div>
            <div id="scheduleGrid" class="grid grid-cols-1 md:grid-cols-5 gap-3"></div>
        </div>
    </section>

    <section class="max-w-6xl mx-auto px-6 pb-20 grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
        <div class="card-container" onclick="location.href='manuals-list.html'"><div class="icon-wrapper text-blue-600"><i class="fas fa-folder-open"></i></div><div class="p-6 flex justify-between items-center"><h3 class="font-bold text-gray-800">Manual Archive</h3><i class="fas fa-chevron-right text-gray-200"></i></div></div>
        <div class="card-container" onclick="openVideoModal()"><div class="icon-wrapper text-red-500"><i class="fas fa-play-circle"></i></div><div class="p-6 flex justify-between items-center"><h3 class="font-bold text-gray-800">Assembly Guide</h3><i class="fas fa-chevron-right text-gray-200"></i></div></div>
        <div class="card-container" onclick="location.href='location-guide.html'"><div class="icon-wrapper text-green-600"><i class="fas fa-map-marked-alt"></i></div><div class="p-6 flex justify-between items-center"><h3 class="font-bold text-gray-800">Location Guide</h3><i class="fas fa-chevron-right text-gray-200"></i></div></div>
        <div class="card-container" onclick="window.open('https://docs.google.com/spreadsheets/d/e/2PACX-1vS8K4qcRhrjAWltpEoweWyh612n-ZxOUg1xb170ynA1ArlL0qJBQv0bQ6Ow-zUgDTC80OCXbJ3QIHfo/pubhtml?gid=2004724448&single=true','_blank')"><div class="icon-wrapper text-orange-500"><i class="fas fa-boxes"></i></div><div class="p-6 flex justify-between items-center"><h3 class="font-bold text-gray-800">Stock Check</h3><i class="fas fa-external-link-alt text-gray-200"></i></div></div>
        <div class="card-container" onclick="location.href='safety-main.html'"><div class="icon-wrapper text-teal-600"><i class="fas fa-user-shield"></i></div><div class="p-6 flex justify-between items-center"><h3 class="font-bold text-gray-800">Safety Center</h3><i class="fas fa-chevron-right text-gray-200"></i></div></div>
        <div class="card-container" onclick="openStockModal()"><div class="icon-wrapper text-indigo-600"><i class="fas fa-edit"></i></div><div class="p-6 flex justify-between items-center"><h3 class="font-bold text-gray-800">Stock Entry</h3><i class="fas fa-plus text-gray-200"></i></div></div>
        <div class="card-container" onclick="location.href='old-vs-new.html'"><div class="icon-wrapper text-gray-700"><i class="fas fa-columns"></i></div><div class="p-6 flex justify-between items-center"><h3 class="font-bold text-gray-800">Old vs New</h3><i class="fas fa-chevron-right text-gray-200"></i></div></div>
    </section>

    <div id="videoModal" class="fixed inset-0 bg-black/60 hidden items-center justify-center p-6"><div class="modal-content bg-white w-full max-w-xs rounded-3xl overflow-hidden shadow-2xl"><div class="bg-red-600 p-6 text-center text-white"><h3 class="font-black italic uppercase">Select Format</h3></div><div class="p-5 space-y-3"><button onclick="window.open('https://www.youtube.com/playlist?list=PLn2hkf3EgnF3PQYhgiJzIymmjHNIgSLUG','_blank')" class="w-full py-4 bg-gray-50 font-bold rounded-2xl border flex items-center justify-center gap-2">가로형 (Desktop)</button><button onclick="window.open('https://www.youtube.com/playlist?list=PLn2hkf3EgnF3mg96oXucuWJ1jWOnXZm77','_blank')" class="w-full py-4 bg-gray-50 font-bold rounded-2xl border flex items-center justify-center gap-2">세로형 (Shorts)</button><button onclick="closeVideoModal()" class="w-full py-2 text-[10px] font-bold text-gray-400 uppercase">Close</button></div></div></div>
    <div id="stockModal" class="fixed inset-0 bg-black/60 hidden items-center justify-center p-6"><div class="modal-content bg-white w-full max-w-xs rounded-3xl overflow-hidden shadow-2xl"><div class="bg-indigo-600 p-6 text-center text-white"><h3 class="font-black italic uppercase">Select Location</h3></div><div class="p-5 space-y-2"><button onclick="window.open('https://script.google.com/macros/s/AKfycbwBpvKlJ_BmTJOHL2UpBLp042UYCmQfffz2gYCNMVETkiGXJA7K9O0hg2xIUO0c3X7Qzg/exec','_blank')" class="w-full py-4 bg-gray-50 font-bold rounded-2xl border">Room A</button><button onclick="window.open('https://script.google.com/macros/s/AKfycbzwGAbtEy19lrdeZZ1ZZCGXshhHxQbhAnKrmTfabjgceP-Z_jvXNON2c2j-Hz367d6E/exec','_blank')" class="w-full py-4 bg-gray-50 font-bold rounded-2xl border">Room B</button><button onclick="window.open('https://script.google.com/macros/s/AKfycbxZIXNdwB4LVZr8cfADW4R5CqgbBTy4DpwmKpEmOeq0IHdcVtA01im2RR-nVkyoq3Ri/exec','_blank')" class="w-full py-4 bg-gray-50 font-bold rounded-2xl border">P2 Storage</button><button onclick="closeStockModal()" class="w-full py-2 text-[10px] font-bold text-gray-400 uppercase">Cancel</button></div></div></div>

    <script>
        const SCRIPT_URL = "여기에_새로_배포한_URL을_넣으세요";
        let allScheduleData = [];
        let currentView = 'weekly', viewDate = new Date();

        window.onload = () => { fetchNotice(); loadSchedule(); };
        function openVideoModal() { document.getElementById('videoModal').classList.replace('hidden', 'flex'); }
        function closeVideoModal() { document.getElementById('videoModal').classList.replace('flex', 'hidden'); }
        function openStockModal() { document.getElementById('stockModal').classList.replace('hidden', 'flex'); }
        function closeStockModal() { document.getElementById('stockModal').classList.replace('flex', 'hidden'); }

        async function fetchNotice() {
            try {
                const res = await fetch(SCRIPT_URL + "?action=getNotice");
                document.getElementById('noticeDisplay').innerText = await res.text() || "공지사항이 없습니다.";
            } catch (e) { document.getElementById('noticeDisplay').innerText = "Notice Sync Error"; }
        }

        async function loadSchedule() {
            try {
                const res = await fetch(SCRIPT_URL + "?action=getSchedule");
                allScheduleData = await res.json();
                renderSchedule();
            } catch (e) { document.getElementById('scheduleGrid').innerHTML = "로드 실패"; }
        }

        function renderSchedule() {
            const grid = document.getElementById('scheduleGrid'), calHeader = document.getElementById('calendarHeader');
            const todayStr = getKSTDateString(new Date());
            grid.innerHTML = "";
            
            if (currentView === 'weekly') {
                document.getElementById('monthNav').classList.add('hidden'); calHeader.classList.add('hidden');
                grid.className = "grid grid-cols-1 md:grid-cols-5 gap-3";
                const diff = new Date().getDay() === 0 ? -6 : 1 - new Date().getDay();
                const mon = new Date(new Date().setDate(new Date().getDate() + diff)), fri = new Date(mon); fri.setDate(mon.getDate() + 4);
                const monStr = getKSTDateString(mon), friStr = getKSTDateString(fri);
                renderCards(allScheduleData.filter(d => normalizeDate(d.date) >= monStr && normalizeDate(d.date) <= friStr), grid, todayStr, false);
                document.getElementById('currentRangeText').innerText = `${monStr} - ${friStr}`;
            } else {
                document.getElementById('monthNav').classList.remove('hidden'); calHeader.classList.remove('hidden');
                grid.className = "grid grid-cols-7 gap-1 md:gap-2";
                const targetY = viewDate.getFullYear(), targetM = viewDate.getMonth() + 1;
                document.getElementById('displayMonthLabel').innerText = `${targetM}월`;
                const firstDay = new Date(targetY, targetM - 1, 1).getDay();
                for(let i=0; i<firstDay; i++) { grid.innerHTML += "<div></div>"; }
                renderCards(allScheduleData.filter(item => {
                    const d = new Date(normalizeDate(item.date));
                    return d.getFullYear() === targetY && (d.getMonth() + 1) === targetM;
                }).sort((a,b) => new Date(normalizeDate(a.date)) - new Date(normalizeDate(b.date))), grid, todayStr, true);
            }
        }

        function renderCards(data, container, todayStr, isMonthly) {
            data.forEach(item => {
                const itemDate = new Date(normalizeDate(item.date)), isToday = normalizeDate(item.date) === todayStr;
                let colorClass = itemDate.getDay() === 0 ? "sun" : (itemDate.getDay() === 6 ? "sat" : "");
                container.innerHTML += `<div class="schedule-card ${isToday ? 'today-card shadow-md' : ''} ${isMonthly ? 'text-[8px] min-h-[70px]' : ''}">${isToday ? '<span class="today-badge">TODAY</span>' : ''}<div class="font-black ${colorClass} mb-1 uppercase tracking-tighter">${item.day}</div><div class="${isMonthly ? 'text-[9px]' : 'text-sm'} font-bold mb-2">${itemDate.getDate()}일</div><div class="text-left space-y-1 border-t pt-2 overflow-hidden"><div><span class="text-gray-400 font-bold italic">A</span> ${item.am || '-'}</div><div><span class="text-gray-400 font-bold italic">P</span> ${item.pm || '-'}</div></div></div>`;
            });
        }

        function switchView(view) {
            currentView = view; viewDate = new Date();
            document.getElementById('btnWeekly').className = view === 'weekly' ? 'px-6 py-2 text-xs font-bold rounded-lg bg-white text-blue-600 shadow-sm' : 'px-6 py-2 text-xs font-bold rounded-lg text-gray-500';
            document.getElementById('btnMonthly').className = view === 'monthly' ? 'px-6 py-2 text-xs font-bold rounded-lg bg-white text-blue-600 shadow-sm' : 'px-6 py-2 text-xs font-bold rounded-lg text-gray-500';
            renderSchedule();
        }
        function changeMonth(diff) { viewDate.setMonth(viewDate.getMonth() + diff); renderSchedule(); }
        function normalizeDate(d) { const date = new Date(d); return isNaN(date) ? String(d).trim() : getKSTDateString(date); }
        function getKSTDateString(date) { return `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, '0')}-${String(date.getDate()).padStart(2, '0')}`; }
    </script>
</body>
</html>
