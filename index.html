<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STO 582 Racking Archive</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;700&family=Noto+Sans+KR:wght@400;700&display=swap');
        
        body { font-family: 'Inter', 'Noto Sans KR', sans-serif; background-color: #fafafa; letter-spacing: -0.02em; }
        
        /* 카드 디자인 유지 */
        .card-container { 
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); 
            height: 100%; display: flex; flex-direction: column; cursor: pointer; 
            background: white; border: 1px solid #e5e7eb; border-radius: 12px; overflow: hidden;
        }
        .card-container:hover { 
            transform: translateY(-8px); 
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1); border-color: #0058a3;
        }
        .icon-wrapper {
            height: 160px; display: flex; align-items: center; justify-content: center;
            font-size: 3.5rem; background-color: #f8fafc; transition: 0.3s;
        }
        .card-container:hover .icon-wrapper { background-color: #0058a3; color: #ffdb00; }
        .arrow-btn {
            width: 40px; height: 40px; background-color: #f1f5f9; border-radius: 50%;
            display: flex; align-items: center; justify-content: center; color: #64748b; transition: 0.3s;
        }
        .card-container:hover .arrow-btn { background-color: #ffdb00; color: #0058a3; transform: rotate(-45deg); }

        @media (max-width: 768px) {
            .grid-layout { display: flex; flex-direction: column; gap: 12px; padding: 0 16px; }
            .card-container { flex-direction: row !important; height: auto; align-items: center; }
            .icon-wrapper { height: 80px; width: 80px; font-size: 1.8rem; flex-shrink: 0; }
            .content-wrapper { padding: 16px !important; flex-grow: 1; display: flex; justify-content: space-between; align-items: center; }
            .content-wrapper h3 { margin-bottom: 0 !important; font-size: 1rem; }
        }
    </style>
</head>
<body>

    <header class="pt-20 pb-12 px-6 max-w-6xl mx-auto text-center">
        <h1 class="text-4xl md:text-5xl font-extrabold mb-6 text-gray-900 tracking-tight italic">STO 582 Racking Archive</h1>
        <p class="text-gray-500 text-lg leading-relaxed max-w-2xl mx-auto px-4">
            이케아 코워커를 위한 랙킹 통합 가이드 센터<br>
            <span class="text-xs font-medium text-gray-400 uppercase tracking-widest">Digital Hub for Racking Specialists</span>
        </p>
    </header>

    <section class="max-w-6xl mx-auto px-6 mb-12">
        <div class="bg-white border-2 border-dashed border-gray-200 rounded-2xl p-5 shadow-sm">
            <div class="flex justify-between items-center mb-3">
                <h2 class="text-sm font-bold text-gray-700 flex items-center gap-2 uppercase tracking-wider">
                    <i class="fas fa-cloud text-blue-500"></i> LIVE Specialist Notice
                </h2>
                <button onclick="toggleEditor()" id="editBtn" class="text-[10px] font-bold bg-gray-50 text-gray-400 px-2 py-1 rounded hover:bg-gray-100 transition border">EDIT</button>
            </div>

            <div id="noticeDisplay" class="min-h-[60px] p-4 bg-gray-50 rounded-xl text-sm leading-relaxed text-gray-600">
                <p class="text-gray-300 italic animate-pulse">데이터를 불러오는 중입니다... (Syncing...)</p>
            </div>

            <div id="editorSection" class="hidden mt-4 pt-4 border-t border-gray-100 space-y-3">
                <div id="loginForm" class="flex items-center gap-2">
                    <input type="text" id="adminId" placeholder="ID" class="w-20 px-2 py-1 text-xs border rounded outline-none">
                    <input type="password" id="adminPw" placeholder="PW" class="w-20 px-2 py-1 text-xs border rounded outline-none">
                    <button onclick="checkAuth()" class="bg-blue-600 text-white px-3 py-1 text-xs rounded font-bold">인증</button>
                </div>

                <div id="editTools" class="hidden space-y-3">
                    <div class="flex flex-wrap gap-2 items-center bg-gray-100 p-1.5 rounded-lg">
                        <select id="fontSize" onchange="execCmd('fontSize', this.value)" class="text-[10px] border rounded px-1 py-0.5 outline-none">
                            <option value="3">보통 (Normal)</option>
                            <option value="5">크게 (Large)</option>
                            <option value="7">매우 크게 (XL)</option>
                        </select>
                        <input type="color" id="fontColor" onchange="execCmd('foreColor', this.value)" class="w-6 h-6 p-0 border-0 bg-transparent cursor-pointer">
                        <button onclick="execCmd('bold')" class="w-7 h-7 bg-white border rounded flex items-center justify-center text-xs"><i class="fas fa-bold"></i></button>
                        <button onclick="deleteNotice()" class="ml-auto text-[10px] text-red-400 font-bold px-2 py-1 border border-red-100 rounded bg-white hover:bg-red-50">전체 삭제</button>
                    </div>
                    <div id="richEditor" contenteditable="true" class="w-full min-h-[100px] p-4 border-2 border-blue-100 rounded-xl bg-white focus:outline-blue-400 text-sm"></div>
                    <div class="flex justify-end gap-2">
                        <button onclick="toggleEditor()" class="px-3 py-1.5 text-xs font-bold text-gray-400">취소</button>
                        <button id="saveBtn" onclick="saveNotice()" class="px-5 py-1.5 bg-blue-600 text-white rounded-lg text-xs font-bold shadow-md hover:bg-blue-700">저장 (Sync to Sheet)</button>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <section class="py-12">
        <div class="max-w-6xl mx-auto grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8 grid-layout">
            
            <div class="card-container" onclick="location.href='manuals-list.html'">
                <div class="icon-wrapper text-blue-600"><i class="fas fa-folder-open"></i></div>
                <div class="p-8 content-wrapper">
                    <div><h3 class="text-xl font-bold text-gray-800">Manual Archive</h3><p class="text-sm text-gray-500 mt-1 font-medium">매뉴얼 모음</p></div>
                    <div class="arrow-btn"><i class="fas fa-arrow-right"></i></div>
                </div>
            </div>

            <div class="card-container" onclick="openVideoModal()">
                <div class="icon-wrapper text-red-500"><i class="fas fa-play-circle"></i></div>
                <div class="p-8 content-wrapper">
                    <div><h3 class="text-xl font-bold text-gray-800">Assembly Guide</h3><p class="text-sm text-gray-500 mt-1 font-medium">조립 가이드 영상</p></div>
                    <div class="arrow-btn"><i class="fas fa-arrow-right"></i></div>
                </div>
            </div>

            <div class="card-container" onclick="location.href='location-guide.html'">
                <div class="icon-wrapper text-green-600"><i class="fas fa-map-marked-alt"></i></div>
                <div class="p-8 content-wrapper">
                    <div><h3 class="text-xl font-bold text-gray-800">Location Guide</h3><p class="text-sm text-gray-500 mt-1 font-medium">랙킹 위치 안내</p></div>
                    <div class="arrow-btn"><i class="fas fa-arrow-right"></i></div>
                </div>
            </div>

            <div class="card-container" onclick="window.open('https://docs.google.com/spreadsheets/d/1B0Y7uU1z6r9...', '_blank')">
                <div class="icon-wrapper text-orange-500"><i class="fas fa-boxes"></i></div>
                <div class="p-8 content-wrapper">
                    <div><h3 class="text-xl font-bold text-gray-800">Stock Check</h3><p class="text-sm text-gray-500 mt-1 font-medium">재고 확인 (Live)</p></div>
                    <div class="arrow-btn"><i class="fas fa-external-link-alt text-xs"></i></div>
                </div>
            </div>

            <div class="card-container" onclick="location.href='safety-main.html'">
                <div class="icon-wrapper text-teal-600"><i class="fas fa-user-shield"></i></div>
                <div class="p-8 content-wrapper">
                    <div><h3 class="text-xl font-bold text-gray-800">Safety Center</h3><p class="text-sm text-gray-500 mt-1 font-medium">안전 교육 센터</p></div>
                    <div class="arrow-btn"><i class="fas fa-arrow-right"></i></div>
                </div>
            </div>

            <div class="card-container" onclick="location.href='old-vs-new.html'">
                <div class="icon-wrapper text-gray-700"><i class="fas fa-columns"></i></div>
                <div class="p-8 content-wrapper">
                    <div><h3 class="text-xl font-bold text-gray-800">Old vs New</h3><p class="text-sm text-gray-500 mt-1 font-medium">신규/구형 비교 자료</p></div>
                    <div class="arrow-btn"><i class="fas fa-arrow-right"></i></div>
                </div>
            </div>

        </div>
    </section>

    <script>
        // 🔗 구글 앱스 스크립트 주소 연동
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxEPJlbaVpPFy-D3kMC2aRd7K4d_5RPWDN79Y2lOuTKGBNEA6CB_hf6ANYLTE4zFwgz/exec";
        
        const VALID_ID = "sto582";
        const VALID_PW = "sto582";
        const display = document.getElementById('noticeDisplay');
        const editor = document.getElementById('richEditor');
        const editorSection = document.getElementById('editorSection');

        // 페이지 로드 시 구글 시트에서 최신 데이터 가져오기
        window.addEventListener('DOMContentLoaded', fetchNotice);

        async function fetchNotice() {
            try {
                const response = await fetch(SCRIPT_URL);
                const text = await response.text();
                display.innerHTML = text || '<p class="text-gray-300 italic">등록된 메시지가 없습니다. (No messages.)</p>';
            } catch (e) {
                display.innerHTML = '<span class="text-red-400 text-xs italic">데이터 연결 실패 (Connection Error)</span>';
            }
        }

        async function saveNotice() {
            const saveBtn = document.getElementById('saveBtn');
            saveBtn.innerText = "Syncing...";
            saveBtn.disabled = true;

            const content = editor.innerHTML;
            try {
                // 구글 시트로 데이터 전송 (POST)
                await fetch(SCRIPT_URL, {
                    method: 'POST',
                    body: JSON.stringify({ action: "save", content: content })
                });
                display.innerHTML = content;
                alert("구글 시트와 성공적으로 동기화되었습니다!");
                toggleEditor();
            } catch (e) {
                alert("동기화 실패! 네트워크 상태를 확인하세요.");
            } finally {
                saveBtn.innerText = "저장 (Sync to Sheet)";
                saveBtn.disabled = false;
            }
        }

        function checkAuth() {
            if (document.getElementById('adminId').value === VALID_ID && 
                document.getElementById('adminPw').value === VALID_PW) {
                document.getElementById('loginForm').classList.add('hidden');
                document.getElementById('editTools').classList.remove('hidden');
                editor.innerHTML = (display.innerHTML.includes('등록된 메시지가 없습니다')) ? "" : display.innerHTML;
            } else { alert("아이디 또는 비밀번호가 틀렸습니다."); }
        }

        function toggleEditor() { editorSection.classList.toggle('hidden'); }
        function execCmd(cmd, value) { document.execCommand(cmd, false, value); }
        function deleteNotice() { if (confirm("삭제하시겠습니까?")) { editor.innerHTML = ""; saveNotice(); } }
    </script>
</body>
</html>
