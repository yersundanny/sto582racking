<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STO 582 Racking Archive</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700&family=Noto+Sans+KR:wght@400;700&display=swap');
        body { font-family: 'Inter', 'Noto Sans KR', sans-serif; background-color: #fafafa; }
        
        .card-container { transition: 0.3s ease; background: white; border: 1px solid #e5e7eb; border-radius: 12px; overflow: hidden; cursor: pointer; }
        .card-container:hover { transform: translateY(-8px); box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1); border-color: #0058a3; }
        .icon-wrapper { height: 140px; display: flex; align-items: center; justify-content: center; font-size: 3rem; background-color: #f8fafc; transition: 0.3s; }
        .card-container:hover .icon-wrapper { background-color: #0058a3; color: #ffdb00; }
        
        .schedule-card { background: white; border: 1px solid #eee; border-radius: 12px; padding: 15px; transition: 0.3s; min-height: 140px; }
        .today-card { border: 2px solid #0058a3 !important; background-color: #f0f7ff !important; position: relative; }
        .today-badge { position: absolute; top: 10px; right: 10px; background: #0058a3; color: white; font-size: 9px; font-weight: 900; padding: 2px 6px; border-radius: 99px; }

        /* 월 전환 애니메이션 */
        #scheduleGrid { transition: opacity 0.2s ease-in-out; }
        .fade-out { opacity: 0; }
    </style>
</head>
<body>

    <header class="pt-16 pb-12 px-6 max-w-6xl mx-auto text-center">
        <h1 class="text-4xl md:text-5xl font-black mb-4 text-blue-800 italic uppercase">STO 582 Racking Archive</h1>
        <p class="text-gray-500 text-lg font-medium">이케아 코워커를 위한 랙킹 통합 가이드 센터</p>
    </header>

    <section class="max-w-6xl mx-auto px-6 mb-8">
        <div class="bg-white border-2 border-dashed border-gray-200 rounded-2xl p-5 shadow-sm">
            <div id="noticeDisplay" class="text-sm text-gray-600 px-2 text-center">공지사항 로딩 중...</div>
        </div>
    </section>

    <section class="max-w-6xl mx-auto px-6 mb-12">
        <div class="bg-white border border-gray-100 rounded-3xl p-6 md:p-8 shadow-sm">
            
            <div class="flex flex-col md:flex-row justify-between items-center mb-8 gap-4">
                <div class="flex items-center gap-4">
                    <div id="monthNav" class="hidden flex items-center gap-3 bg-gray-50 px-3 py-1 rounded-full border">
                        <button onclick="changeMonth(-1)" class="p-2 hover:text-blue-600 transition"><i class="fas fa-chevron-left"></i></button>
                        <span id="displayMonthLabel" class="font-black text-lg text-gray-800 min-w-[60px] text-center italic">8월</span>
                        <button onclick="changeMonth(1)" class="p-2 hover:text-blue-600 transition"><i class="fas fa-chevron-right"></i></button>
                    </div>
                    <div id="weeklyLabel">
                        <h2 class="text-2xl font-black text-gray-900 italic uppercase tracking-tighter">Weekly Plan</h2>
                        <p id="currentRangeText" class="text-xs text-blue-600 font-bold font-mono uppercase italic">Syncing...</p>
                    </div>
                </div>

                <div class="flex bg-gray-100 p-1 rounded-xl shadow-inner w-full md:w-auto">
                    <button onclick="switchView('weekly')" id="btnWeekly" class="flex-1 md:flex-none px-6 py-2 text-xs font-bold rounded-lg transition-all bg-white text-blue-600 shadow-sm">WEEKLY</button>
                    <button onclick="switchView('monthly')" id="btnMonthly" class="flex-1 md:flex-none px-6 py-2 text-xs font-bold rounded-lg transition-all text-gray-500 hover:text-gray-700">MONTHLY</button>
                </div>
            </div>
            
            <div id="scheduleGrid" class="grid grid-cols-1 md:grid-cols-5 gap-4 text-center">
                </div>
        </div>
    </section>

    <section class="max-w-6xl mx-auto px-6 pb-20 grid grid-cols-1 md:grid-cols-3 gap-8">
        <div class="card-container" onclick="location.href='manuals-list.html'"><div class="icon-wrapper text-blue-600"><i class="fas fa-folder-open"></i></div><div class="p-6 font-bold">Manual Archive</div></div>
        <div class="card-container" onclick="openVideoModal()"><div class="icon-wrapper text-red-500"><i class="fas fa-play-circle"></i></div><div class="p-6 font-bold">Assembly Guide</div></div>
        <div class="card-container" onclick="window.open('https://docs.google.com/spreadsheets/d/e/2PACX-1vS8K4qcRhrjAWltpEoweWyh612n-ZxOUg1xb170ynA1ArlL0qJBQv0bQ6Ow-zUgDTC80OCXbJ3QIHfo/pubhtml?gid=2004724448&single=true','_blank')"><div class="icon-wrapper text-orange-500"><i class="fas fa-boxes"></i></div><div class="p-6 font-bold">Stock Check</div></div>
    </section>

    <script>
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycby4P1z72hWZj6QDX4tX2sjO3UOg8ujPc7I3T0hjq8tz3z_dbZRZD7nsF1OGLN-aLCRF/exec";
        let allScheduleData = [];
        let currentView = 'weekly';
        let viewDate = new Date(); // 현재 보고 있는 날짜 기준

        window.addEventListener('DOMContentLoaded', () => {
            fetchNotice();
            loadSchedule();
        });

        async function fetchNotice() {
            try {
                const res = await fetch(SCRIPT_URL + "?action=getNotice");
                document.getElementById('noticeDisplay').innerHTML = await res.text() || '공지사항이 없습니다.';
            } catch (e) { document.getElementById('noticeDisplay').innerText = "Sync Error"; }
        }

        async function loadSchedule() {
            try {
                const res = await fetch(SCRIPT_URL + "?action=getSchedule");
                allScheduleData = await res.json();
                renderSchedule();
            } catch (e) { document.getElementById('scheduleGrid').innerHTML = "데이터 로드 실패"; }
        }

        function renderSchedule() {
            const grid = document.getElementById('scheduleGrid');
            const todayStr = getKSTDateString(new Date());
            grid.classList.add('fade-out'); // 전환 애니메이션

            setTimeout(() => {
                grid.innerHTML = "";
                
                if (currentView === 'weekly') {
                    document.getElementById('monthNav').classList.add('hidden');
                    document.getElementById('weeklyLabel').classList.remove('hidden');
                    
                    // 주간 필터링 (이번 주 월-금)
                    const now = new Date();
                    const day = now.getDay();
                    const diffToMon = day === 0 ? -6 : 1 - day;
                    const monday = new Date(new Date().setDate(now.getDate() + diffToMon));
                    const friday = new Date(monday); friday.setDate(monday.getDate() + 4);
                    
                    const monStr = getKSTDateString(monday);
                    const friStr = getKSTDateString(friday);

                    const weekData = allScheduleData.filter(d => {
                        const s = normalizeDate(d.date);
                        return s >= monStr && s <= friStr;
                    });

                    renderCards(weekData, grid, todayStr);
                    document.getElementById('currentRangeText').innerText = `${monStr} - ${friStr}`;
                } 
                else {
                    document.getElementById('monthNav').classList.remove('hidden');
                    document.getElementById('weeklyLabel').classList.add('hidden');
                    
                    const targetYear = viewDate.getFullYear();
                    const targetMonth = viewDate.getMonth() + 1;
                    document.getElementById('displayMonthLabel').innerText = `${targetMonth}월`;

                    // 선택된 달의 데이터만 필터링
                    const monthData = allScheduleData.filter(item => {
                        const d = new Date(normalizeDate(item.date));
                        return d.getFullYear() === targetYear && (d.getMonth() + 1) === targetMonth;
                    }).sort((a,b) => new Date(normalizeDate(a.date)) - new Date(normalizeDate(b.date)));

                    renderCards(monthData, grid, todayStr);
                }
                grid.classList.remove('fade-out');
            }, 200);
        }

        function renderCards(data, container, todayStr) {
            if (data.length === 0) {
                container.innerHTML = "<p class='col-span-5 py-20 text-gray-400 italic'>표시할 일정이 없습니다.</p>";
                return;
            }
            data.forEach(item => {
                const isToday = normalizeDate(item.date) === todayStr;
                container.innerHTML += `
                    <div class="schedule-card ${isToday ? 'today-card shadow-md' : ''}">
                        ${isToday ? '<span class="today-badge">TODAY</span>' : ''}
                        <div class="text-[10px] font-black text-blue-600 mb-1 uppercase tracking-widest">${item.day}요일</div>
                        <div class="text-sm font-bold mb-3 text-gray-900">${formatDate(item.date)}</div>
                        <div class="text-[11px] text-left space-y-2 border-t pt-3 text-gray-600">
                            <div><span class="font-bold text-[9px] text-gray-400">AM</span> ${item.am || '-'}</div>
                            <div><span class="font-bold text-[9px] text-gray-400">PM</span> ${item.pm || '-'}</div>
                        </div>
                    </div>
                `;
            });
        }

        function switchView(view) {
            currentView = view;
            viewDate = new Date(); // 뷰 전환 시 항상 오늘 달로 초기화
            document.getElementById('btnWeekly').className = view === 'weekly' ? 'flex-1 md:flex-none px-6 py-2 text-xs font-bold rounded-lg bg-white text-blue-600 shadow-sm' : 'flex-1 md:flex-none px-6 py-2 text-xs font-bold rounded-lg text-gray-500';
            document.getElementById('btnMonthly').className = view === 'monthly' ? 'flex-1 md:flex-none px-6 py-2 text-xs font-bold rounded-lg bg-white text-blue-600 shadow-sm' : 'flex-1 md:flex-none px-6 py-2 text-xs font-bold rounded-lg text-gray-500';
            renderSchedule();
        }

        function changeMonth(diff) {
            viewDate.setMonth(viewDate.getMonth() + diff);
            renderSchedule();
        }

        function normalizeDate(d) { const date = new Date(d); return isNaN(date) ? String(d).trim() : getKSTDateString(date); }
        function getKSTDateString(date) { return `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, '0')}-${String(date.getDate()).padStart(2, '0')}`; }
        function formatDate(dStr) { const d = new Date(dStr); return isNaN(d) ? dStr : `${d.getMonth()+1}월 ${d.getDate()}일`; }
    </script>
</body>
</html>
