<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STO 582 Racking Archive</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;700&family=Noto+Sans+KR:wght@400;700&display=swap');
        body { font-family: 'Inter', 'Noto Sans KR', sans-serif; background-color: #fafafa; letter-spacing: -0.02em; }
        .card-container { transition: all 0.2s ease; background: white; border: 1px solid #e5e7eb; border-radius: 12px; overflow: hidden; }
        .today-card { border: 2px solid #0058a3 !important; background-color: #f0f7ff !important; position: relative; }
        .today-badge { position: absolute; top: 10px; right: 10px; background: #0058a3; color: white; font-size: 8px; font-weight: 900; padding: 2px 6px; border-radius: 99px; }
        .tab-active { background-color: #0058a3; color: white; border-color: #0058a3; }
    </style>
</head>
<body>

    <header class="pt-16 pb-10 px-6 max-w-6xl mx-auto text-center">
        <h1 class="text-4xl font-extrabold mb-4 text-gray-900 italic text-blue-800">STO 582 Racking Archive</h1>
        <p class="text-gray-400 text-sm uppercase tracking-widest font-bold">Specialist Schedule Management</p>
    </header>

    <section class="max-w-6xl mx-auto px-6 mb-12">
        <div class="bg-white border border-gray-100 rounded-3xl p-6 md:p-8 shadow-sm">
            <div class="flex flex-col md:flex-row justify-between items-center gap-6 mb-8">
                <div class="text-center md:text-left">
                    <h2 id="viewTitle" class="text-2xl font-black text-gray-900 italic tracking-tighter uppercase">Weekly Schedule</h2>
                    <p id="currentRangeText" class="text-xs text-blue-600 font-bold mt-1 font-mono uppercase">Loading...</p>
                </div>
                
                <div class="flex bg-gray-100 p-1 rounded-xl shadow-inner">
                    <button id="tabWeek" onclick="switchView('week')" class="px-6 py-2 text-xs font-bold rounded-lg tab-active transition-all">WEEKLY</button>
                    <button id="tabMonth" onclick="switchView('month')" class="px-6 py-2 text-xs font-bold rounded-lg text-gray-400 hover:text-gray-600 transition-all">MONTHLY</button>
                </div>
            </div>

            <div id="scheduleGrid" class="grid grid-cols-1 md:grid-cols-5 gap-4">
                </div>
        </div>
    </section>

    <script>
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycby4P1z72hWZj6QDX4tX2sjO3UOg8ujPc7I3T0hjq8tz3z_dbZRZD7nsF1OGLN-aLCRF/exec";
        let currentMode = 'week'; // 'week' or 'month'
        let cachedData = [];

        window.addEventListener('DOMContentLoaded', loadData);

        async function loadData() {
            try {
                const response = await fetch(SCRIPT_URL + "?action=getSchedule");
                cachedData = await response.json();
                renderSchedule();
            } catch (e) {
                document.getElementById('scheduleGrid').innerHTML = "<p class='col-span-5 text-center text-red-400 py-10'>데이터를 불러오지 못했습니다.</p>";
            }
        }

        function switchView(mode) {
            currentMode = mode;
            // 버튼 스타일 업데이트
            document.getElementById('tabWeek').className = mode === 'week' ? "px-6 py-2 text-xs font-bold rounded-lg tab-active transition-all" : "px-6 py-2 text-xs font-bold rounded-lg text-gray-400 hover:text-gray-600 transition-all";
            document.getElementById('tabMonth').className = mode === 'month' ? "px-6 py-2 text-xs font-bold rounded-lg tab-active transition-all" : "px-6 py-2 text-xs font-bold rounded-lg text-gray-400 hover:text-gray-600 transition-all";
            
            document.getElementById('viewTitle').innerText = mode === 'week' ? "Weekly Schedule" : "Monthly Schedule";
            renderSchedule();
        }

        function renderSchedule() {
            const grid = document.getElementById('scheduleGrid');
            const rangeText = document.getElementById('currentRangeText');
            const now = new Date();
            
            grid.innerHTML = "";
            let displayData = [];

            if (currentMode === 'week') {
                // 이번 주 월~금 필터링
                const day = now.getDay();
                const diffToMon = day === 0 ? -6 : 1 - day;
                const monday = new Date(new Date().setDate(now.getDate() + diffToMon));
                monday.setHours(0,0,0,0);
                const friday = new Date(monday);
                friday.setDate(monday.getDate() + 4);
                
                displayData = cachedData.filter(d => {
                    const dDate = new Date(d.date);
                    return dDate >= monday && dDate <= friday;
                });
                grid.className = "grid grid-cols-1 md:grid-cols-5 gap-4";
                rangeText.innerText = `${formatDate(monday)} - ${formatDate(friday)}`;
            } else {
                // 이번 달 전체 필터링 (토/일 제외)
                const firstDay = new Date(now.getFullYear(), now.getMonth(), 1);
                const lastDay = new Date(now.getFullYear(), now.getMonth() + 1, 0);
                
                displayData = cachedData.filter(d => {
                    const dDate = new Date(d.date);
                    const isWeekend = dDate.getDay() === 0 || dDate.getDay() === 6;
                    return dDate >= firstDay && dDate <= lastDay && !isWeekend;
                });
                grid.className = "grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4"; // 월 단위는 리스트 형태로 확장
                rangeText.innerText = `${now.getFullYear()}년 ${now.getMonth() + 1}월 전체 일정`;
            }

            displayData.forEach(item => {
                const isToday = new Date(item.date).toDateString() === now.toDateString();
                grid.innerHTML += `
                    <div class="card-container p-5 ${isToday ? 'today-card' : ''}">
                        ${isToday ? '<span class="today-badge uppercase">Today</span>' : ''}
                        <div class="flex justify-between items-center mb-3">
                            <span class="text-[10px] font-black text-blue-600 uppercase tracking-widest">${item.day}요일</span>
                            <span class="text-xs font-bold text-gray-900">${formatDate(item.date)}</span>
                        </div>
                        <div class="space-y-3">
                            <div class="bg-white/50 p-2 rounded-lg">
                                <span class="text-[9px] font-bold text-gray-400 uppercase block">AM</span>
                                <p class="text-xs text-gray-700 mt-1 font-medium">${item.am || '-'}</p>
                            </div>
                            <div class="bg-white/50 p-2 rounded-lg border-t border-gray-100">
                                <span class="text-[9px] font-bold text-gray-400 uppercase block">PM</span>
                                <p class="text-xs text-gray-700 mt-1 font-medium">${item.pm || '-'}</p>
                            </div>
                        </div>
                        ${item.note ? `<p class="mt-3 text-[9px] text-red-500 font-bold italic border-t pt-2">${item.note}</p>` : ''}
                    </div>
                `;
            });
        }

        function formatDate(dStr) {
            const d = new Date(dStr);
            return `${d.getMonth() + 1}월 ${d.getDate()}일`;
        }
    </script>
</body>
</html>
