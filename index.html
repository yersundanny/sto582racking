<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STO 582 Racking Archive</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;700&family=Noto+Sans+KR:wght@400;700&display=swap');
        body { font-family: 'Inter', 'Noto Sans KR', sans-serif; background-color: #fafafa; letter-spacing: -0.02em; }
        .card-container { transition: all 0.3s ease; height: 100%; display: flex; flex-direction: column; cursor: pointer; background: white; border: 1px solid #e5e7eb; border-radius: 12px; overflow: hidden; }
        .card-container:hover { transform: translateY(-8px); box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1); border-color: #0058a3; }
        .icon-wrapper { height: 160px; display: flex; align-items: center; justify-content: center; font-size: 3.5rem; background-color: #f8fafc; transition: 0.3s; }
        .card-container:hover .icon-wrapper { background-color: #0058a3; color: #ffdb00; }
        
        /* 오늘 날짜 강조 스타일 */
        .today-card { border: 2px solid #0058a3 !important; background-color: #f0f7ff !important; position: relative; }
        .today-badge { position: absolute; top: 12px; right: 12px; background: #0058a3; color: white; font-size: 8px; font-bold: 900; padding: 2px 6px; border-radius: 99px; }
    </style>
</head>
<body>

    <header class="pt-20 pb-12 px-6 max-w-6xl mx-auto text-center">
        <h1 class="text-4xl md:text-5xl font-extrabold mb-6 text-gray-900 tracking-tight italic text-blue-800">STO 582 Racking Archive</h1>
        <p class="text-gray-500 text-lg leading-relaxed max-w-2xl mx-auto italic">
            "Safe Racking, Safe People"<br>
            <span class="text-xs font-medium text-gray-400 uppercase tracking-widest not-italic">Digital Hub for Racking Specialists</span>
        </p>
    </header>

    <section class="max-w-6xl mx-auto px-6 mb-8">
        <div class="bg-white border-2 border-dashed border-gray-200 rounded-2xl p-5 shadow-sm">
            <div class="flex justify-between items-center mb-3">
                <h2 class="text-sm font-bold text-gray-700 flex items-center gap-2 uppercase tracking-wider">
                    <i class="fas fa-bullhorn text-blue-600"></i> Specialist Notice
                </h2>
                <button onclick="toggleEditor()" class="text-[10px] font-bold bg-gray-50 text-gray-400 px-2 py-1 rounded hover:bg-gray-100 transition border uppercase">Admin Edit</button>
            </div>
            <div id="noticeDisplay" class="min-h-[60px] p-4 bg-gray-50 rounded-xl text-sm leading-relaxed text-gray-600">
                <p class="text-gray-300 italic animate-pulse">공지사항을 동기화 중입니다...</p>
            </div>
            
            <div id="editorSection" class="hidden mt-4 pt-4 border-t space-y-3">
                <div id="loginForm" class="flex items-center gap-2">
                    <input type="password" id="adminPw" placeholder="Access PW" class="w-32 px-2 py-1 text-xs border rounded outline-none">
                    <button onclick="checkAuth()" class="bg-blue-600 text-white px-3 py-1 text-xs rounded font-bold">인증</button>
                </div>
                <div id="editTools" class="hidden space-y-3">
                    <div id="richEditor" contenteditable="true" class="w-full min-h-[100px] p-4 border-2 border-blue-100 rounded-xl bg-white focus:outline-blue-400 text-sm"></div>
                    <div class="flex justify-end gap-2">
                        <button onclick="saveNotice()" id="saveBtn" class="px-5 py-1.5 bg-blue-600 text-white rounded-lg text-xs font-bold shadow-md">저장 및 동기화</button>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <section class="max-w-6xl mx-auto px-6 mb-12">
        <div class="bg-white border-2 border-gray-100 rounded-3xl p-8 shadow-sm">
            <div class="flex flex-col md:flex-row justify-between items-end gap-4 mb-8">
                <div>
                    <h2 class="text-3xl font-black text-gray-900 italic tracking-tighter uppercase">Specialist Daily Plan</h2>
                    <p id="currentWeekRange" class="text-sm text-blue-600 font-bold mt-1 uppercase tracking-wider font-mono text-xs">WEEKLY SCHEDULE LOADING...</p>
                </div>
                <div class="text-[10px] font-bold text-gray-400 border px-3 py-1 rounded-full uppercase">08:30 - 17:30 Normal Work</div>
            </div>
            <div id="scheduleGrid" class="grid grid-cols-1 md:grid-cols-5 gap-4">
                <p class="text-gray-400 italic p-10 col-span-5 text-center">스케줄을 동기화 중입니다...</p>
            </div>
        </div>
    </section>

    <section class="pb-20 px-6">
        <div class="max-w-6xl mx-auto grid grid-cols-1 md:grid-cols-3 gap-8">
            <div class="card-container" onclick="location.href='manuals-list.html'">
                <div class="icon-wrapper text-blue-600"><i class="fas fa-folder-open"></i></div>
                <div class="p-8 flex justify-between items-center">
                    <div><h3 class="text-xl font-bold text-gray-800">Manuals</h3><p class="text-xs text-gray-400 mt-1 uppercase">매뉴얼 보음</p></div>
                    <i class="fas fa-arrow-right text-gray-200"></i>
                </div>
            </div>
            <div class="card-container" onclick="location.href='safety-main.html'">
                <div class="icon-wrapper text-red-500"><i class="fas fa-shield-alt"></i></div>
                <div class="p-8 flex justify-between items-center">
                    <div><h3 class="text-xl font-bold text-gray-800">Safety Center</h3><p class="text-xs text-gray-400 mt-1 uppercase">안전 교육 센터</p></div>
                    <i class="fas fa-arrow-right text-gray-200"></i>
                </div>
            </div>
            <div class="card-container" onclick="location.href='location-guide.html'">
                <div class="icon-wrapper text-green-600"><i class="fas fa-map-marked-alt"></i></div>
                <div class="p-8 flex justify-between items-center">
                    <div><h3 class="text-xl font-bold text-gray-800">Location</h3><p class="text-xs text-gray-400 mt-1 uppercase">랙킹 위치 안내</p></div>
                    <i class="fas fa-arrow-right text-gray-200"></i>
                </div>
            </div>
        </div>
    </section>

    <script>
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycby4P1z72hWZj6QDX4tX2sjO3UOg8ujPc7I3T0hjq8tz3z_dbZRZD7nsF1OGLN-aLCRF/exec";

        window.addEventListener('DOMContentLoaded', () => {
            fetchNotice();
            loadWeeklySchedule();
        });

        // 📢 공지사항 로드
        async function fetchNotice() {
            try {
                const response = await fetch(SCRIPT_URL + "?action=getNotice");
                const text = await response.text();
                document.getElementById('noticeDisplay').innerHTML = text || '등록된 공지가 없습니다.';
            } catch (e) { document.getElementById('noticeDisplay').innerText = "Notice Sync Error"; }
        }

        // 📅 현재 주차 자동 필터링 스케줄 로드
        async function loadWeeklySchedule() {
            const grid = document.getElementById('scheduleGrid');
            const weekRangeText = document.getElementById('currentWeekRange');
            
            try {
                const response = await fetch(SCRIPT_URL + "?action=getSchedule");
                const allData = await response.json();
                
                // 이번 주 월요일/금요일 계산
                const now = new Date();
                const day = now.getDay();
                const diffToMon = day === 0 ? -6 : 1 - day;
                const monday = new Date(new Date().setDate(now.getDate() + diffToMon));
                monday.setHours(0,0,0,0);
                const friday = new Date(monday);
                friday.setDate(monday.getDate() + 4);
                friday.setHours(23,59,59,999);

                // 현재 주차 데이터 필터링
                const thisWeekData = allData.filter(d => {
                    const dDate = new Date(d.date);
                    return dDate >= monday && dDate <= friday;
                });

                grid.innerHTML = "";
                thisWeekData.forEach(item => {
                    const isToday = new Date(item.date).toDateString() === new Date().toDateString();
                    grid.innerHTML += `
                        <div class="card-container p-5 ${isToday ? 'today-card' : ''}">
                            ${isToday ? '<span class="today-badge uppercase">Today</span>' : ''}
                            <span class="text-[10px] font-black text-blue-600 uppercase tracking-widest">${item.day}</span>
                            <p class="text-lg font-bold text-gray-900 mb-4">${formatDate(item.date)}</p>
                            <div class="space-y-4">
                                <div><span class="text-[10px] font-bold text-gray-400 uppercase">AM</span><p class="text-sm text-gray-700 mt-1 font-medium leading-tight">${item.am || '-'}</p></div>
                                <div class="pt-3 border-t border-gray-200"><span class="text-[10px] font-bold text-gray-400 uppercase">PM</span><p class="text-sm text-gray-700 mt-1 font-medium leading-tight">${item.pm || '-'}</p></div>
                            </div>
                            ${item.note ? `<p class="mt-3 text-[10px] text-red-500 font-bold italic">${item.note}</p>` : ''}
                        </div>
                    `;
                });
                weekRangeText.innerText = `PLAN: ${formatDate(monday)} - ${formatDate(friday)}`;
            } catch (e) { grid.innerHTML = "<p class='col-span-5 text-center py-10 text-red-400'>스케줄 동기화 실패</p>"; }
        }

        function formatDate(dStr) {
            const d = new Date(dStr);
            return `${d.getMonth()+1}월 ${d.getDate()}일`;
        }

        // 관리자 기능 (비밀번호: sto582)
        function toggleEditor() { document.getElementById('editorSection').classList.toggle('hidden'); }
        function checkAuth() {
            if (document.getElementById('adminPw').value === "sto582") {
                document.getElementById('loginForm').classList.add('hidden');
                document.getElementById('editTools').classList.remove('hidden');
                document.getElementById('richEditor').innerHTML = document.getElementById('noticeDisplay').innerHTML;
            } else { alert("비밀번호 틀림"); }
        }
        async function saveNotice() {
            const btn = document.getElementById('saveBtn');
            btn.innerText = "Syncing..."; btn.disabled = true;
            try {
                await fetch(SCRIPT_URL, { method: 'POST', body: JSON.stringify({ action: "save", content: document.getElementById('richEditor').innerHTML }) });
                fetchNotice(); toggleEditor(); alert("공지사항 업데이트 완료!");
            } catch (e) { alert("저장 실패"); } finally { btn.innerText = "저장 및 동기화"; btn.disabled = false; }
        }
    </script>
</body>
</html>
