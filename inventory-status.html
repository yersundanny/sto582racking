<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>STO 582 Inventory Center</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700&family=Noto+Sans+KR:wght@400;700&display=swap');
        body { font-family: 'Inter', 'Noto Sans KR', sans-serif; background-color: #fafafa; }
        /* ✅ 검색바 상단 고정 */
        .sticky-search { position: sticky; top: 0; z-index: 100; background: rgba(250,250,250,0.9); backdrop-filter: blur(10px); padding: 1rem 0; }
        .inventory-card { transition: 0.3s; border-radius: 16px; border: 1px solid #eee; background: white; }
        .inventory-card:hover { transform: translateY(-4px); border-color: #0058a3; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1); }
    </style>
</head>
<body class="pb-20">
    <header class="pt-12 pb-6 px-6 max-w-5xl mx-auto text-center">
        <button onclick="location.href='index.html'" class="mb-4 text-gray-400 hover:text-blue-600 transition"><i class="fas fa-arrow-left mr-2"></i>Back to Home</button>
        <h1 class="text-3xl font-black text-blue-800 italic uppercase">Inventory Center</h1>
    </header>

    <section class="max-w-5xl mx-auto px-6 sticky-search">
        <div class="relative">
            <i class="fas fa-search absolute left-5 top-1/2 -translate-y-1/2 text-gray-400"></i>
            <input type="text" id="searchInput" oninput="showHints(this.value)" autocomplete="off"
                placeholder="아이템 이름 또는 품번 검색..." 
                class="w-full pl-14 pr-6 py-4 bg-white border border-gray-200 rounded-2xl shadow-sm outline-none focus:border-blue-500 transition-all font-bold">
            <div id="hintBox" class="hidden absolute top-full left-0 right-0 bg-white border rounded-2xl shadow-xl z-50 mt-2 max-h-60 overflow-y-auto"></div>
        </div>
    </section>

    <div id="inventoryContainer" class="max-w-5xl mx-auto px-6 grid grid-cols-1 md:grid-cols-2 gap-4 mt-6">
        </div>

    <script>
        // 유선님의 시트 데이터를 가져오는 URL (이전과 동일)
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwvB32kzp1j0dE9yo4PyyBAhqCWzRRnlIFcnH8dxvtEtvN9ibxMxwizqS3_ixH86ntVaA/exec";
        let inventoryData = [];

        window.onload = async () => {
            const res = await fetch(SCRIPT_URL + "?action=getInventory");
            inventoryData = await res.json();
            renderInventory(inventoryData);
        };

        function renderInventory(data) {
            const container = document.getElementById('inventoryContainer');
            container.innerHTML = data.map(item => `
                <div class="inventory-card p-6 flex justify-between items-center" data-name="${item.description}">
                    <div>
                        <div class="text-xs font-black text-blue-600 mb-1 uppercase tracking-tighter">${item.location}</div>
                        <div class="text-lg font-bold text-gray-800">${item.description}</div>
                        <div class="text-sm text-gray-400 font-mono">${item.itemCode || ''}</div>
                    </div>
                    <div class="text-right">
                        <div class="text-2xl font-black text-gray-900">${item.quantity}</div>
                        <div class="text-[10px] text-gray-400 uppercase font-bold">In Stock</div>
                    </div>
                </div>
            `).join('');
        }

        function showHints(val) {
            const hintBox = document.getElementById('hintBox');
            if(!val) { hintBox.classList.add('hidden'); renderInventory(inventoryData); return; }
            
            const matches = inventoryData.filter(i => i.description.toLowerCase().includes(val.toLowerCase()));
            if(matches.length > 0) {
                hintBox.innerHTML = matches.map(m => `<div onclick="applySearch('${m.description}')" class="p-4 hover:bg-gray-50 cursor-pointer border-b last:border-0 text-sm font-bold text-gray-700">${m.description}</div>`).join('');
                hintBox.classList.remove('hidden');
            } else { hintBox.classList.add('hidden'); }
        }

        function applySearch(name) {
            document.getElementById('searchInput').value = name;
            document.getElementById('hintBox').classList.add('hidden');
            // 검색된 아이템만 필터링해서 보여주기
            const filtered = inventoryData.filter(i => i.description === name);
            renderInventory(filtered);
        }
    </script>
</body>
</html>
