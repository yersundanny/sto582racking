<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Inventory Center - STO 582</title>
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&family=Noto+Sans+KR:wght@400;700&display=swap');
        body { font-family: 'Inter', 'Noto Sans KR', sans-serif; background-color: #fafafa; }
        
        /* 검색 힌트 드롭다운 스타일 */
        .search-hint-item { cursor: pointer; padding: 12px 18px; transition: 0.2s; font-size: 13px; font-weight: 600; border-bottom: 1px solid #f8fafc; }
        .search-hint-item:last-child { border-bottom: none; }
        .search-hint-item:hover { background-color: #f0f7ff; color: #0058a3; }

        /* 재고 카드 디자인 */
        .inventory-card { background: white; border-radius: 28px; border: 1px solid #f1f5f9; transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        .inventory-card:hover { transform: translateY(-10px); shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.08); border-color: #0058a3; }
        
        .img-box { position: relative; width: 100%; height: 220px; background-color: #f8fafc; overflow: hidden; }
        .img-box img { width: 100%; height: 100%; object-fit: cover; }
        
        .line-clamp-2 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    </style>
</head>
<body class="pb-24">

    <header class="pt-16 pb-10 px-6 max-w-5xl mx-auto flex justify-between items-end">
        <div>
            <button onclick="location.href='index.html'" class="text-blue-800 mb-3 flex items-center gap-2 text-xs font-black uppercase tracking-tighter">
                <i class="fas fa-chevron-left"></i> Specialist Home
            </button>
            <h1 class="text-4xl font-black text-gray-900 italic uppercase tracking-tighter">Inventory Center</h1>
        </div>
        <div class="hidden md:block text-right">
            <span class="text-[10px] font-black text-blue-800 bg-blue-50 border border-blue-100 px-3 py-1 rounded-full uppercase italic">STO 582 Exclusive</span>
        </div>
    </header>

    <section class="max-w-5xl mx-auto px-6 mb-12 relative">
        <div class="relative group">
            <i class="fas fa-search absolute left-6 top-1/2 -translate-y-1/2 text-gray-300 group-focus-within:text-blue-600 transition-colors"></i>
            <input type="text" id="searchInput" oninput="showHints(this.value)" autocomplete="off"
                placeholder="영문 제품명 입력 (예: Divider, Beam...)" 
                class="w-full pl-16 pr-6 py-5 bg-white border border-gray-100 rounded-3xl shadow-sm outline-none focus:ring-4 focus:ring-blue-500/10 focus:border-blue-500 transition-all font-bold text-sm uppercase tracking-tight">
            
            <div id="hintBox" class="hidden absolute top-[calc(100%+10px)] left-0 right-0 bg-white border border-gray-100 rounded-2xl shadow-2xl z-50 overflow-hidden max-h-80 overflow-y-auto"></div>
        </div>
    </section>

    <section class="max-w-5xl mx-auto px-6 grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8" id="inventoryGrid">
        <p class="col-span-full py-20 text-center text-gray-400 font-bold animate-pulse">📊 데이터를 동기화하고 있습니다...</p>
    </section>

    <script>
        // 유선님의 구글 앱스 스크립트 URL (통합 코드용)
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwvB32kzp1j0dE9yo4PyyBAhqCWzRRnlIFcnH8dxvtEtvN9ibxMxwizqS3_ixH86ntVaA/exec";
        
        let inventoryData = [];

        // 페이지 로드 시 실행
        window.addEventListener('DOMContentLoaded', loadInventory);

        async function loadInventory() {
            try {
                const res = await fetch(SCRIPT_URL + "?action=getInventory");
                inventoryData = await res.json();
                renderInventory(inventoryData);
            } catch (e) {
                document.getElementById('inventoryGrid').innerHTML = "<p class='col-span-full py-20 text-center text-red-400 font-bold'>⚠️ 데이터 연동 실패. 시트나 스크립트 설정을 확인해주세요.</p>";
            }
        }

        function showHints(val) {
            const hintBox = document.getElementById('hintBox');
            if (!val || val.length < 1) { hintBox.classList.add('hidden'); return; }

            const matches = inventoryData
                .filter(item => item.description.toLowerCase().includes(val.toLowerCase()))
                .slice(0, 6);

            if (matches.length > 0) {
                hintBox.innerHTML = matches.map(m => `
                    <div class="search-hint-item" onclick="applySearch('${m.description}')">
                        <span class="text-blue-600 font-black mr-2">[${m.itemNo}]</span> ${m.description}
                    </div>
                `).join('');
                hintBox.classList.remove('hidden');
            } else {
                hintBox.classList.add('hidden');
            }
        }

        function applySearch(val) {
            document.getElementById('searchInput').value = val;
            document.getElementById('hintBox').classList.add('hidden');
            const filtered = inventoryData.filter(item => item.description === val);
            renderInventory(filtered);
        }

        function renderInventory(data) {
            const grid = document.getElementById('inventoryGrid');
            if (data.length === 0) {
                grid.innerHTML = "<p class='col-span-full py-20 text-center text-gray-400'>검색 결과가 없습니다.</p>";
                return;
            }

            grid.innerHTML = data.map(item => `
                <div class="inventory-card overflow-hidden">
                    <div class="img-box border-b border-gray-50">
                        <img src="photos/${item.itemNo}.jpg" onerror="this.src='https://via.placeholder.com/400x300?text=IKEA+Product'" class="hover:scale-110 transition-transform duration-500">
                        <div class="absolute top-4 left-4 bg-blue-800 text-white text-[10px] font-black px-3 py-1 rounded-full italic shadow-lg">${item.itemNo}</div>
                    </div>
                    <div class="p-8">
                        <h3 class="text-base font-black text-gray-900 mb-5 h-12 line-clamp-2 uppercase leading-tight tracking-tight">${item.description}</h3>
                        
                        <div class="grid grid-cols-2 gap-3 mb-5">
                            <div class="bg-blue-50/50 p-4 rounded-2xl border border-blue-100 text-center">
                                <span class="block text-[8px] font-black text-blue-400 uppercase mb-1">Total Stock</span>
                                <span class="text-xl font-black text-blue-800">${item.total}</span>
                            </div>
                            <div class="bg-gray-50 p-4 rounded-2xl border border-gray-100 text-center">
                                <span class="block text-[8px] font-black text-gray-400 uppercase mb-1">Location</span>
                                <span class="text-xs font-bold text-gray-700">${item.section || '-'}-${item.shelf || '-'}</span>
                            </div>
                        </div>
                        
                        <div class="flex gap-2 mb-6">
                            <div class="flex-1 bg-white border border-gray-100 p-2 rounded-xl text-center">
                                <span class="block text-[8px] font-bold text-gray-300 uppercase">P2</span>
                                <span class="text-xs font-black text-gray-600">${item.p2}</span>
                            </div>
                            <div class="flex-1 bg-white border border-gray-100 p-2 rounded-xl text-center">
                                <span class="block text-[8px] font-bold text-gray-300 uppercase">Zone A</span>
                                <span class="text-xs font-black text-gray-600">${item.a}</span>
                            </div>
                            <div class="flex-1 bg-white border border-gray-100 p-2 rounded-xl text-center">
                                <span class="block text-[8px] font-bold text-gray-300 uppercase">Zone B</span>
                                <span class="text-xs font-black text-gray-600">${item.b}</span>
                            </div>
                        </div>

                        <div class="text-[9px] font-bold text-gray-400 border-t pt-4 flex justify-between items-center tracking-widest uppercase">
                            <span>Weight Limit</span>
                            <span class="text-gray-800 font-black">${item.weightLimit || 'N/A'}</span>
                        </div>
                    </div>
                </div>
            `).join('');
        }
    </script>
</body>
</html>
